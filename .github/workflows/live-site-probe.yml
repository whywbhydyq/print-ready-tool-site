name: Live Site Probe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live Vercel site
        run: |
          set -euxo pipefail
          BASE="https://print-ready-tool-site.vercel.app"
          curl -fL "$BASE/" -o home.html
          grep -q "Print-Ready Size Calculators" home.html
          curl -fL "$BASE/print-size-calculator/" | grep -q "Print Size Calculator"
          curl -fL "$BASE/kdp-cover-calculator/" | grep -q "KDP Cover Size Calculator"
          curl -fL "$BASE/etsy-printable-size-calculator/" | grep -q "Etsy Printable Size Pack Calculator"
          curl -fL "$BASE/sitemap.xml" | grep -q "print-size-calculator"
          curl -fL "$BASE/robots.txt" | grep -q "sitemap.xml"
          echo "Live site probe passed."
